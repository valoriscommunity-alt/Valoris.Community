name: Gestisci contenuti Valoris
on:
  workflow_dispatch:
    inputs:
      content:
        description: 'events oppure news'
        required: true
        type: choice
        options: [events, news]
      json:
        description: 'JSON completo del contenuto (array per eventi/news)'
        required: true
        type: string
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write content
        env:
          KIND: ${{ inputs.content }}
          JSON: ${{ inputs.json }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const kind=process.env.KIND; const raw=process.env.JSON;
          const data=JSON.parse(raw); if(!Array.isArray(data)) throw new Error('Il JSON deve essere un array.');
          const key=kind==='events'?'events':'news';
          fs.writeFileSync(`data/${key}.json`, JSON.stringify(kind==='events'?{ok:true,events:data}:{ok:true,news:data},null,2)+'\n');
          const v={version:'GITHUB-'+new Date().toISOString().slice(0,10),build:'github-pages',updatedAt:new Date().toISOString()};
          fs.writeFileSync('public/version.json',JSON.stringify(v,null,2)+'\n');
          NODE
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ public/version.json
          git commit -m "content: update ${{ inputs.content }}" || exit 0
          git push
